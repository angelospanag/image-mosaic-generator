[project]
name = "image-mosaic-generator"
version = "0.1.0"
description = "Create mosaics of images using a collection of smaller images"
authors = [
    { name = "Angelos Panagiotopoulos", email = "angelospanag@protonmail.com" },
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.1",
    "opencv-python>=4.11.0.86",
    "pillow>=12.1.0",
    "scikit-learn>=1.8.0",
    "tqdm>=4.67.1",
    "typer>=0.21.1",
]

[dependency-groups]
dev = ["ruff>=0.14.11"]
