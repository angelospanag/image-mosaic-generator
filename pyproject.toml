[project]
name = "image-mosaic-generator"
version = "0.1.0"
description = "Create mosaics of images using a collection of smaller images"
authors = [
    { name = "Angelos Panagiotopoulos", email = "angelospanag@protonmail.com" },
]
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "tqdm>=4.70.1",
    "typer>=0.27.3",
]

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.4", "ty>=0.0.98"]

[tool.ruff]
lint.select = [
    "E",
    "W",
    "F",
    "B",
    "I",
    "N",
    "SIM",
    "UP",
    "PERF",
    "RET",
    "RSE",
]
